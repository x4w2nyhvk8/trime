# Trime 自定义样式配置文件
# 编码: utf-8
# 界面风格与功能开关

config_version: "3.0"
name: 方块
author: linzianxyz

# 锚点定义
height:
  1: &key_height 30 # 按键高度
  2: &keyboard_height_land 200 # 横屏键盘锁定高度
  3: &keyboard_height 245 # 竖屏键盘锁定高度
  4: &horizontal_gap 4 # 按键水平间距
  5: &vertical_gap 9 # 键盘行距
  6: &keyboard_padding 1 # 键盘左右边距

round_corner:
  1: &round_corner 8 # 按键圆角半径

# style（界面样式及特色功能）
style:
  auto_caps: false                     # 自动句首大写（关闭）
  candidate_corner_radius: 5           # 候选圆角
  candidate_font: [pingfang.ttf]          # 候选词字体
  candidate_padding: 3                 # 候选项内边距（减小避免截断）
  candidate_spacing: 0.5               # 候选分割线
  candidate_text_size: 20              # 候选词字号
  candidate_text_vertical_bias: 1.0    # 候选文本垂直偏移（overlay模式）
#  candidate_use_cursor: false          # 是否使用光标指示高亮候选
  candidate_view_height: 28            # 候选区高度
  comment_font: [pingfang.ttf]            # 编码提示字体
  comment_height: 14                   # 编码提示区高度
  comment_position: right              # 编码提示布局位置（右侧）
  comment_text_size: 12                # 编码提示字号
  comment_vertical_bias: 0.0           # 编码提示垂直偏移（overlay模式）
  enter_label_mode: 0                  # 是否使用App提供的ActionLabel
  enter_labels:
    go: 发送
    done: 完成
    next: 下个
    pre: 上个
    search: 检索
    send: 发送
    default: 确认
  hanb_font: [pingfang.ttf]
#  horizontal: true                     # 候选词水平排列
  horizontal_gap: *horizontal_gap      # 水平间距（引用锚点）
  key_border: 1                        # 按键边框宽度
  key_font: [pingfang.ttf, iconfont.ttf]  # 按键字体
  key_height: *key_height              # 按键高度（引用锚点）
  key_long_text_size: 15               # 长按提示符号字号
  key_symbol_offset_x: -5              # 长按符号水平偏移
  key_symbol_offset_y: 6               # 长按符号垂直偏移
  key_text_size: 20                    # 按键主文本字号
  key_width: 10.0                      # 按键宽度占屏幕宽的百分比
  keyboard_height: *keyboard_height    # 锁竖屏高度（引用锚点）
  keyboard_height_land: *keyboard_height_land  # 锁横屏高度（引用锚点）
  keyboard_padding: *keyboard_padding         # 竖屏左右边距
  keyboard_padding_bottom: 70          # 竖屏底部边距
  keyboard_padding_land: 40            # 横屏左右边距
  keyboard_padding_land_bottom: 8      # 横屏底部边距
  keyboard_padding_left: 0             # 竖屏左手模式左侧边距
  keyboard_padding_right: 0            # 竖屏右手模式右侧边
  label_font: [pingfang.ttf, iconfont.ttf]         # 悬浮窗序号字体
  label_text_size: 22                  # 标签文字大小
  latin_font: [pingfang.ttf]              # 西文字体
  popup_bottom_margin: 68              # 气泡底部边距
  popup_font: [pingfang.ttf]              # 按键气泡字体
  popup_height: 48                     # 气泡高度
  popup_key_height: 48                 # 气泡内按键高度
  popup_text_size: 23                  # 气泡文字字号
  popup_width: 38                      # 气泡宽度
  reset_ascii_mode_on_focus_change: true  # 焦点变化时重置为中文状态
  round_corner: *round_corner          # 按键圆角半径（引用锚点）
  shadow_radius: 8                     # 按键阴影
  symbol_font: [pingfang.ttf, iconfont.ttf]  # 符号字体
  symbol_text_size: 10                 # 符号字号
  text_font: [pingfang.ttf]               # 编码区字体
  vertical_gap: *vertical_gap          # 键盘行距（引用锚点）

#  预编辑区（preedit）
preedit:
  foreground:
    font_size: 16 # 预编辑区文字大小
  horizontal_padding: 8 # 预编辑区水平内距
  top_end_radius: 4 # 预编辑区上端圆角半径

# 候选窗口
window:
  alpha: 1 # 候选窗口透明度（1=不透明）
  border: 2 # 边框宽度
  corner_radius: 3 # 圆角半径
  foreground:
    label_font_size: 14 # 候选词序号字体大小
    text_font_size: 14 # 候选词文字字体大小
    comment_font_size: 14 # 候选词注释字体大小
  insets:
    vertical: 3 # 纵向内距
    horizontal: 3 # 横向内距
  item_padding:
    vertical: 2 # 候选词纵向内距
    horizontal: 4 # 候选词横向内距
  min_width: 5 # 最小宽度
  shadow: 3.0 # 阴影

# （toolbar） 
tool_bar:
  back_style: "ic@chevron-left" # 返回图标
  button_font: [iconfont.ttf] # 工具栏按钮字体
  button_spacing: 2 # 按钮水平间隙
#工具栏图标依次从右到左
  hide_button: &hide_button # 隐藏按钮锚点
    foreground:
      style: "ic@keyboard-close" # 图标样式（隐藏图标）
      font_size: 18 # 图标大小
      padding: 7 # 内距
    action: Hide # 动作：隐藏键盘
  edit_button: &edit_button # 编辑按钮锚点
    foreground:
      style: "ic@cursor-text" # 图标样式
      font_size: 18
      padding: 7
    action: Keyboard_editor # 动作：切换到编辑键盘
  clipboard_button: &clipboard_button # 剪贴板按钮锚点
    foreground:
      style: "ic@clipboard-outline" # 图标样式
      font_size: 18
      padding: 7
    action: clipboard_window # 动作：打开剪贴板窗口
  emoji_button: &emoji_button # 表情按钮锚点
    foreground:
      style: "ic@emoticon-outline" # 图标样式
      font_size: 18
      padding: 7
    action: liquid_keyboard_emoji # 动作：打开表情liquid键盘
  horizontal_inset: 2 # 工具栏水平内距
  primary_button: # 主按钮（菜单键）
    background:
      type: rectangle # 形状：矩形
      corner_radius: 0 # 圆角
      bg_normal: "0x00" # 一般状态背景（完全透明）
      bg_hightlight: "hilited_candidate_button_color" # 按下状态背景（引用高亮候选按钮颜色）
      vertical_inset: 4 # 垂直内距
      horizontal_inset: 0 # 水平内距
    foreground:
      style: "\ue261" # 图标样式
      normal: candidate_text_color # 一般状态前景色（候选文字颜色）
      padding: 3 # 内距
    action: menu_keyboard # 动作：打开菜单键盘
    long_press_action: Settings # 长按动作：打开设置
  buttons: # 其他按钮
    - *hide_button # 隐藏
    - *edit_button # 编辑
    - *clipboard_button # 剪贴板
    - *emoji_button # 表情

# （liquid_keyboard）
liquid_keyboard:
  author: "tumuyan"
  candidate_corner_radius: 8
  fixed_key_bar:
    position: bottom
    keys:
      - liquid_keyboard_exit
      - space1
      - BackSpace1
  keyboards: [history, ascii, cn, emoji, math, yanwenzi, clipboard, collection, draft, symbollist, list, ids, symbol, tabs, pinyin, script_symbols, jp, grease, rusa, korea, lation, yinbiao, unit, combing]
  key_height: 40
  key_height_land: 40
  margin_x: 2
  row: 6
  row_land: 5
  single_width: 60   
  tabs:
    name: 更多
    type: TABS
  vertical_gap: 8
  history:
    name: 常用
    type: HISTORY
  ascii:
    type: SINGLE
    name: 英文
    keys: ["!", "\"", "#", "$", "%", "&", "'", "(", ")", "*", "+", ",", "-", ".", "/", ":", ";", "<", "=", ">", "?", "@", "[", "\\", "]", "^", "_", "`", "{", "|", "}", "~"]
  emoji:
    type: SINGLE
    name: emoji
