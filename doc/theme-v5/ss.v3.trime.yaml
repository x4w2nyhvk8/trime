# 配色方案
preset_color_schemes:
  default:
    name: "默认"
    author: "linzianxyz"
    dark_scheme: night
    color_format: rgb
    root_background: 0xFFE8EAEF           # 浅灰蓝
    keyboard_background: 0xFFE8EAEF       # 浅灰蓝
    candidate_background: 0xFFE8EAEF      # [保留] 与键盘背景一致，不区分
    keyboard_back_color: 0xFFE8EAEF       # 浅灰蓝
    liquid_keyboard_background: 0xFFF0F2F7  # 更浅灰蓝
    back_color: 0xFFE8EAEF                # 浅灰蓝
    text_back_color: 0xFFE8EAEF           # 浅灰蓝
    text_color: 0xFF8E8E93                # 中灰
    hilited_text_color: 0xFF000000        # 纯黑
    hilited_back_color: 0xFFDCE0E8        # 稍深灰蓝
    hilited_shadow_color: 0x00000000      # 透明   
    candidate_text_color: 0xFF000000      # 纯黑
    candidate_back_color: 0xFFE8EAEF      # 浅灰蓝
    candidate_shadow_color: 0x00000000    # 透明
    candidate_separator_color: 0x33D0D4DC  # [改进] 半透明浅灰（20%透明度）
    candidate_border_color: 0x00000000    # [保留] 透明，不添加边框
    hilited_candidate_text_color: 0xFF000000    # 纯黑
    hilited_candidate_back_color: 0xFFE8EAEF   # [改进] 柔和高亮背景（非纯白）
    hilited_candidate_shadow_color: 0x00000000  # 透明
    hilited_candidate_button_color: 0xFFFFFFFF  # 纯白    
    comment_text_color: 0xFF6C6C70        # [改进] 加深注释文字（原0xFF8E8E93）
    hilited_comment_text_color: 0xFF6C6C70  # [改进] 同上
    label_color: 0xFF6C6C70               # [改进] 加深标签文字
    key_back_color: 0xFFFDFDFD            # 近白
    key_border_color: 0x00000000           # 按键边界
    key_text_color: 0xFF000000            # 纯黑
    key_symbol_color: 0xFF6B7280          # 深灰
