# 预设键盘布局（preset_keyboards） 
preset_keyboards:
  default:
    author: "暖暖"
    name: 26键默认布局
    reset_ascii_mode: true
    ascii_mode: 0 # 默认中文状态
    label_transform: uppercase # 中⽂模式下按键字⺟标签⾃动⼤写（ uppercase ：⾃动⼤写，none ：⽆，可省略不写）
    lock: true # 锁住键盘不自动切换
    columns: 10 # 最大列数
    width: 10 # 默认按键宽度
    height: 50 # 默认按键高度
    key_hint_offset_x: 0 # 助记符号水平偏移
    key_hint_offset_y: 0 # 助记符号垂直偏移
    key_symbol_offset_x: 10 # 长按符号水平偏移
    key_symbol_offset_y: 3 # 长按符号垂直偏移
    key_text_offset_x: 0 # 按键文本水平偏移
    key_text_offset_y: 3 # 按键文本垂直偏移
    key_press_offset_x: 1 # 按下时文本水平偏移
    key_press_offset_y: -1 # 按下时文本垂直偏移
    landscape_keyboard: landscape_default # 横屏关联布局
    keys:
      - { click: q, long_click: 1, swipe_up: "!" }
      - { click: w, long_click: 2, swipe_up: "@" }
      - { click: e, long_click: 3, swipe_up: "#" }
      - { click: r, long_click: 4, swipe_up: "$" }
      - { click: t, long_click: 5, swipe_up: "%" }
      - { click: y, long_click: 6, swipe_up: "^" }
      - { click: u, long_click: 7, swipe_up: "&" }
      - { click: i, long_click: 8, swipe_up: "*" }
      - { click: o, long_click: 9, swipe_up: "(" }
      - { click: p, long_click: 0, swipe_up: ")" }
      - { width: 5 } # 空白间隙
      - { click: a, long_click: "@", swipe_up: select_all } # 上滑全选
      - { click: s, long_click: "*", swipe_up: "`" }
      - { click: d, long_click: "+", swipe_up: "-" }
      - { click: f, long_click: "-", swipe_up: "_" }
      - { click: g, long_click: "=", swipe_up: "@" }
      - { click: h, long_click: "/", swipe_up: "(" }
# 修改后（直接告知 Trime 发送这些字符，跳过“查找按键名”的步骤）
      - { click: j, long_click: "#", swipe_up: { send: ")" } }
      - { click: k, long_click: "(", swipe_up: { send: "'" } }
      - { click: l, long_click: ")", swipe_up: { send: '"' } }
      - { click: Shift_L_Lock, composing: delimiter, width: 14, key_back_color: bc1, key_text_color: tc1, key_text_offset_y: -1 }
      - { width: 1 }
      - { click: z, long_click: "`", label_symbol: '`', swipe_up: "~" }
      - { click: x, long_click: ":", swipe_up: cut } 
      - { click: c, long_click: '"', swipe_up: '"' }
      - { click: v, long_click: ";", swipe_up: paste, key_symbol_offset_y: 2 }
      - { click: b, long_click: "?", swipe_up: ":" }
      - { click: n, long_click: "!", swipe_up: "," }
      - { click: m, long_click: '^', swipe_up: "." }
      - { width: 1 }
      - { click: BackSpace, width: 14, swipe_up: Escape, key_back_color: bc2, key_text_color: tc2, key_text_offset_y: -1 }
      - {
          click: Keyboard_number,
          long_click: liquid_keyboard_cn,
          label_symbol: "符",
          key_long_text_size: 15,                                                                   
          key_symbol_offset_y: 6,
          key_symbol_offset_x: -1,
          swipe_up: Color_switch, # 上滑切换配色
          width: 15,
          key_back_color: bc2,
        }
      - { click: ',', label: '️ ，️', key_back_color: bc2, key_text_color: tc2, width: 12.5 } # 逗号
      - {
          click: space, # 空格
          long_click: Mode_switch2, # 长按切换中英文
          key_symbol_offset_x: -0.5,
          key_symbol_offset_y: 10,
          functional: true,
          key_text_size: 20,
          key_text_offset_y: -1,
          hint: "T-RIME", # 助记显示
          key_hint_offset_x: -60,
          key_hint_offset_y: -3,
          width: 45,
          key_back_color: bc3, # 背景色=自定义分组3
          key_text_color: tc3,
        }
      - { click: '.', label: ' 。', width: 12.5, swipe_up: "?", key_back_color: bc2, key_text_color: tc2 } # 句号
      - { click: Return, composing: Return1, key_text_offset_y: -1, width: 15, key_back_color: bc4, key_text_color: tc4 }

  editor:
    author: flypy.com
    name: "编辑键盘"
    reset_ascii_mode: true
    ascii_mode: 1 # 默认中文
    width: 20
    height: 40
    keys:
      - { click: cut } 
      - { click: Left1 } 
      - { click: Up } 
      - { click: Right1 } 
      - { click: space, width: 19 } 
      - { click: copy } 
      - { click: Left } 
      - { click: Shift_L2 }
      - { click: Right } 
      - { click: Keyboard_number, width: 19 } 
      - { click: paste, key_back_color: bc2 } 
      - { click: Home } 
      - { click: Down } 
      - { click: End } 
      - { click: BackSpace, width: 19, key_back_color: bc2 } 
      - { click: Keyboard_default }           # ← 返回键移到左下角
      - { click: select_all,key_back_color: bc2 }
      - { click: Tab1 } 
      - { click: redo, key_back_color: bc2 } 
      - { click: Return, width: 19, key_back_color: bc4, key_text_color: tc4 }

  landscape_default:     #横屏键盘
    author: ""
    name: ""
    ascii_keyboard: letter # 英文时切换到letter布局
    ascii_mode: 0
    reset_ascii_mode: true
    label_transform: uppercase
    lock: false # 不锁定
    columns: 20
    width: 10
    height: 52
    key_hint_offset_x: 0
    key_hint_offset_y: 0
    key_symbol_offset_x: 6
    key_symbol_offset_y: 1
    key_text_offset_x: 0
    key_text_offset_y: 3
    key_press_offset_x: 0
    key_press_offset_y: 0
    landscape_split_percent: 0 # 横屏分割比例（0为不分）
    keys:
      - { click: q, swipe_up: "1", width: 7.3 }
      - { click: w, swipe_up: "2", width: 7.3 }
      - { click: e, swipe_up: "3", width: 7.3 }
      - { click: r, swipe_up: "4", width: 7.3 }
      - { click: t, swipe_up: "5", width: 7.3 }
      - { width: 3.0 }
      - { click: "1", width: 7 }
      - { click: "2", width: 7 }
      - { click: "3", width: 7 }
      - { width: 3.0 }
      - { click: y, swipe_up: "6", width: 7.3 }
      - { click: u, swipe_up: "7", width: 7.3 }
      - { click: i, swipe_up: "8", width: 7.3 }
      - { click: o, swipe_up: "9", width: 7.3 }
      - { click: p, swipe_up: "0", width: 7.3 }
      - { click: a, long_click: "@", swipe_up: select_all, width: 7.3 }
      - { click: s, long_click: "*", swipe_up: "`", width: 7.3 }
      - { click: d, long_click: "+", swipe_up: "-", width: 7.3 }
      - { click: f, long_click: "-", swipe_up: "_", width: 7.3 }
      - { click: g, long_click: "=", swipe_up: "@", width: 7.3 }
      - { width: 3.0 }
      - { click: "4", width: 7 }
      - { click: "5", width: 7 }
      - { click: "6", width: 7 }
      - { width: 3.0 }
      - { click: g, long_click: "=", swipe_up: "@", width: 7.3 }
      - { click: h, long_click: "/", swipe_up: "(", width: 7.3 }
      - { click: j, long_click: "#", swipe_up: ")", width: 7.3 }
      - { click: k, long_click: "(", swipe_up: "'", width: 7.3 }
      - { click: l, long_click: ")", swipe_up: '"', width: 7.3 }
      - { click: Shift_L, label_symbol: " ", composing: delimiter, long_click: Shift_L, width: 7.375, key_back_color: bc1, key_text_color: tc1 }
      - { click: z, popup: ["`", "Z"], label_symbol: '`', swipe_up: "~", width: 7.375 } # popup弹出选择
      - { click: x, long_click: ":", swipe_up: cut, width: 7.375 }
      - { click: c, long_click: '"', swipe_up: '"', width: 7.375 }
      - { click: v, long_click: ';', swipe_up: paste, width: 7.375 }
      - { width: 3.0 }
      - { click: "7", width: 7 }
      - { click: "8", width: 7 }
      - { click: "9", width: 7 }
      - { width: 3.0 }
      - { click: b, long_click: "!", swipe_up: ":", width: 7.375 }
      - { click: n, long_click: "?", swipe_up: ",", width: 7.375 }
      - { click: m, long_click: '^', swipe_up: ".", width: 7.375 }
      - { click: BackSpace, width: 14, key_back_color: bc2, key_text_color: tc2 }
      - { click: liquid_keyboard_switch, label: "符", swipe_up: Color_switch, width: 7 }
      - { click: ',', label: '️ ，️', swipe_up: Theme_settings, width: 7 }
      - { click: '?', label: '？', width: 7 }
      - { click: space, functional: true, long_click: Mode_switch2, key_text_size: 15, width: 24.375, key_back_color: bc3, key_text_color: tc3 }
      - { width: 1.5 }
      - { click: '0', width: 7 }
      - { width: 1.5 }
      - { click: space, functional: true, long_click: Mode_switch2, key_text_size: 15, width: 23.625, key_back_color: bc3, key_text_color: tc3 }
      - { click: '.', label: ' 。', swipe_up: "?", width: 7 }
      - { click: Return, composing: Return1, swipe_up: Escape, width: 14, key_back_color: bc4, key_text_color: tc4 }

  letter:
    __include: /preset_keyboards/default
    ascii_mode: 1
    reset_ascii_mode: true
    lock: true
    name: "letter26键"

  number:        #数字键盘
    author: "暖暖"
    name: "数字键盘"
    reset_ascii_mode: true
    lock: false
    ascii_mode: 1
    width: 22
    height: 52
    vertical_gap: *vertical_gap
    horizontal_gap: *horizontal_gap
    key_text_offset_y: 0
    keys:
      - { width: 17, click: '+', long_click: '-', key_text_size: 20, key_back_color: bc2, key_text_color: tc2 }
      - { click: '1' }
      - { click: '2' }
      - { click: '3' }
      - { width: 17, click: BackSpace3, repeatable: true, key_text_size: 21, key_back_color: bc2, key_text_color: tc2 } # 可重复退格
      - { width: 17, click: '%', long_click: '/', key_text_size: 17, key_back_color: bc2, key_text_color: tc2 }
      - { click: '4' }
      - { click: '5' }
      - { click: '6' }
      - { width: 17, click: space, key_text_size: 18, key_back_color: bc2, key_text_color: tc2 }
