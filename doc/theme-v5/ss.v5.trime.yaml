    action: {"name": "action.edit.moveCursorLineEnd"}
  "key.nav.escape":
    label: "取消"
    action: {"name": "action.text.insertText"}
  "key.nav.home":
    label: "行首"
    action: {"name": "action.edit.moveCursorLineStart"}
  "key.nav.left":
    label: "←"
