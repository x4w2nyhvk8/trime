# 被归档配色（见 parked-schemes.yaml）的遗留字段随归档走，不占主题槽位。
legacy_colors:
  day:
    candidate_border_color: 0
    functional_back_color: 4291546837
    off_key_back_color: 4292205024
    # 路径冲突: {"candidate.outline": ["candidate_border_color"], "key.background.system": ["functional_back_color", "off_key_back_color"]}
