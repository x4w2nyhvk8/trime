preset_keyboards:
  default:
    author: "暖暖"
    name: "26键默认布局"
    reset_ascii_mode: true
    ascii_mode: 0
    label_transform: "uppercase"
    lock: true
    columns: 10
    width: 10
    height: 50
    key_hint_offset_x: 0
    key_hint_offset_y: 0
    key_symbol_offset_x: 10
    key_symbol_offset_y: 3
    key_text_offset_x: 0
    key_text_offset_y: 3
    key_press_offset_x: 1
    key_press_offset_y: -1
    landscape_keyboard: "landscape_default"
    keys:
      - {"click": "q", "long_click": 1, "swipe_up": "!"}
      - {"click": "w", "long_click": 2, "swipe_up": "@"}
      - {"click": "e", "long_click": 3, "swipe_up": "#"}
      - {"click": "r", "long_click": 4, "swipe_up": "$"}
      - {"click": "t", "long_click": 5, "swipe_up": "%"}
      - {"click": "y", "long_click": 6, "swipe_up": "^"}
      - {"click": "u", "long_click": 7, "swipe_up": "&"}
      - {"click": "i", "long_click": 8, "swipe_up": "*"}
      - {"click": "o", "long_click": 9, "swipe_up": "("}
      - {"click": "p", "long_click": 0, "swipe_up": ")"}
      - {"width": 5}
      - {"click": "a", "long_click": "@", "swipe_up": "select_all"}
      - {"click": "s", "long_click": "*", "swipe_up": "`"}
      - {"click": "d", "long_click": "+", "swipe_up": "-"}
      - {"click": "f", "long_click": "-", "swipe_up": "_"}
      - {"click": "g", "long_click": "=", "swipe_up": "@"}
      - {"click": "h", "long_click": "/", "swipe_up": "("}
      - {"click": "j", "long_click": "#", "swipe_up": {"send": ")"}}
      - {"click": "k", "long_click": "(", "swipe_up": {"send": "'"}}
      - {"click": "l", "long_click": ")", "swipe_up": {"send": "\""}}
      - {"click": "Shift_L_Lock", "width": 14, "composing": "delimiter", "key_back_color": "bc1", "key_text_color": "tc1", "key_text_offset_y": -1}
      - {"width": 1}
      - {"click": "z", "label_symbol": "`", "long_click": "`", "swipe_up": "~"}
      - {"click": "x", "long_click": ":", "swipe_up": "cut"}
      - {"click": "c", "long_click": "\"", "swipe_up": "\""}
      - {"click": "v", "long_click": ";", "swipe_up": "paste", "key_symbol_offset_y": 2}
      - {"click": "b", "long_click": "?", "swipe_up": ":"}
      - {"click": "n", "long_click": "!", "swipe_up": ","}
      - {"click": "m", "long_click": "^", "swipe_up": "."}
      - {"width": 1}
      - {"click": "BackSpace", "width": 14, "swipe_up": "Escape", "key_back_color": "bc2", "key_text_color": "tc2", "key_text_offset_y": -1}
      - {"click": "Keyboard_number", "width": 15, "label_symbol": "符", "long_click": "liquid_keyboard_cn", "swipe_up": "Color_switch", "key_back_color": "bc2", "key_long_text_size": 15, "key_symbol_offset_y": 6, "key_symbol_offset_x": -1}
      - {"click": ",", "width": 12.5, "label": "️ ，️", "key_back_color": "bc2", "key_text_color": "tc2"}
      - {"click": "space", "width": 45, "hint": "T-RIME", "key_text_size": 20, "long_click": "Mode_switch2", "key_back_color": "bc3", "key_symbol_offset_x": -0.5, "key_symbol_offset_y": 10, "functional": true, "key_text_offset_y": -1, "key_hint_offset_x": -60, "key_hint_offset_y": -3, "key_text_color": "tc3"}
      - {"click": ".", "width": 12.5, "label": " 。", "swipe_up": "?", "key_back_color": "bc2", "key_text_color": "tc2"}
      - {"click": "Return", "width": 15, "composing": "Return1", "key_back_color": "bc4", "key_text_offset_y": -1, "key_text_color": "tc4"}
