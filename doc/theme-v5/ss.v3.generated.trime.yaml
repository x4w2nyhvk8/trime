    ascii_mode: 1
    width: 20
    height: 40
    keys:
      - {"click": "cut"}
      - {"click": "Left1"}
      - {"click": "Up"}
      - {"click": "Right1"}
      - {"click": "space", "width": 19}
      - {"click": "copy"}
      - {"click": "Left"}
      - {"click": "Shift_L2"}
      - {"click": "Right"}
      - {"click": "Keyboard_number", "width": 19}
      - {"click": "paste", "key_back_color": "bc2"}
