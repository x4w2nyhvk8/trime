# develop 全部配色字段 → 统一 token 迁移映射表
# 规范见 ColorNaming.md，token 定义见 keyboard.color.tokens.json
# 数据来源：ColorKey.kt(52) + doc/trime-schema.json(41) + 内置主题位置标签(18)，并集 72
# 每条：legacy 旧名 / source 出处 / token 目标 / selector 状态(可选) / ambiguous 需人工确认(可选)

version: 1.0-draft
spec: ColorNaming.md
target: W3C DTCG 2025.10 + $extensions.org.trime
branch: develop @ 57edd25

colorFormat:
  legacy: "0xAARRGGBB（说明书三章）或 0xRRGGBB（schema maximum 16777215），实际混用"
  new: "#RRGGBBAA（alpha 后置，与元书一致）"
  convert: "0xAARRGGBB → #RRGGBBAA；0xRRGGBB → #RRGGBBFF"
  deprecate: [color_format, "schema 的 maximum: 16777215 应改为 4294967295"]

# 核心规则：旧字段 = 新 token + 状态选择器；selector 为空表示常态
mappings:

  # ── 背景 / 根 ──────────────────────────────
  - { legacy: back_color, source: colorKey, token: component.candidateBar.surface, note: "候选区背景；旧皮肤里也是键盘底色的事实来源" }
  - { legacy: keyboard_back_color, source: colorKey, token: component.keyArea.surface, note: "PDF 注明即将被 keyboard_background 取代" }
  - { legacy: keyboard_background, source: colorKey, token: component.root.surface, note: "铺满候选栏与导航栏的整体背景" }
  - { legacy: root_background, source: colorKey, token: component.root.surface }
  - { legacy: text_back_color, source: colorKey, token: component.candidateBar.surface, note: "编码区背景，与候选区同底" }
  - { legacy: candidate_background, source: colorKey, token: component.candidateBar.surface }
  - { legacy: candidate_back_color, source: extension, token: component.candidateBar.surface }
  - { legacy: liquid_keyboard_background, source: colorKey, token: component.clipboard.surface, note: "liquid / 剪贴板面板，同色系稍亮" }

  # ── 候选 / 编码文字 ──────────────────────────────
  - { legacy: text_color, source: colorKey, token: component.candidateBar.composing.content, note: "未高亮编码文字（不是按键文字）" }
  - { legacy: hilited_text_color, source: colorKey, token: component.candidateBar.composing.content, selector: "composing:active" }
  - { legacy: hilited_back_color, source: colorKey, token: component.candidateBar.selected.surface, selector: "composing:active" }
