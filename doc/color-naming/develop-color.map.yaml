  # ── 气泡 / 弹层 / 长文本 ──────────────────────────────
  - { legacy: preview_back_color, source: schema, token: component.callout.surface, note: "按键气泡" }
  - { legacy: preview_text_color, source: schema, token: component.callout.content }
