  # ── 阴影（语义歧义，需人工确认） ──────────────────────────────
  - { legacy: shadow_color, source: colorKey, token: component.key.contentShadow, ambiguous: true, alternatives: [component.key.elevation, component.key.contentShadow], note: "PDF 定义为『按键文字阴影』，但很多皮肤当作按键下缘阴影用。转换时需作者确认一次，默认落到 contentShadow" }

  # ── 内置主题位置标签（tongwenfeng.trime.yaml） ──────────────────────────────
