  - { legacy: hilited_candidate_text_color, source: colorKey, token: component.candidateBar.selected.content, selector: "candidate:selected" }
  - { legacy: hilited_candidate_back_color, source: colorKey, token: component.candidateBar.selected.surface, selector: "candidate:selected" }
  - { legacy: hilited_candidate_button_color, source: colorKey, token: component.toolbar.pressed.surface, note: "工具栏按钮按下背景" }
  - { legacy: comment_text_color, source: colorKey, token: component.candidateBar.hint }
  - { legacy: hilited_comment_text_color, source: colorKey, token: component.candidateBar.selected.content, selector: "candidate:selected" }
  - { legacy: label_color, source: colorKey, token: component.candidateBar.hint, note: "悬浮窗候选序号" }
  - { legacy: hilited_label_color, source: colorKey, token: component.candidateBar.hint, selector: "candidate:selected" }
  - { legacy: candidate_separator_color, source: colorKey, token: component.candidateBar.outline }
  - { legacy: candidate_border_color, source: colorKey, token: component.candidateBar.outline }
  - { legacy: border_color, source: colorKey, token: component.candidateBar.outline, note: "悬浮窗边框" }
