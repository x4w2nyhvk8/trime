# ── 结构级迁移（不含布局改动）──────────────────
structure:
  schemeMeta:
    legacy: [name, author, dark_scheme, light_scheme]
    new: "$extensions.org.trime.meta.{id,name,author,version,appearance,pair,contrast,previewScene,tags}"
    note: "pair 一处声明明暗配对，替代双向 dark_scheme/light_scheme，杜绝悬空引用"
  fallbackColors:
    legacy: "fallback_colors 隐式链式推导，缺字段会沿链落到意外颜色"
    new: "未定义 token 走显式 defaults + 环检测；lint 可打印整条解析链"
  keyColors:
    legacy: "preset_keys / keys[] 里写 key_back_color: bgn 等位置标签"
    new: "按键只写 role: character|system|modifier|action|space，颜色由 variants 决定"
  layout:
    note: "本提案不改动任何布局结构；role 只是让颜色不再依赖行列坐标"
  preview:
    legacy: "皮肤作者附静态 demo.png（易与实物不一致）"
    new: "meta.previewScene 指定标准场景，设置页与真机共用渲染器现场生成"

compatibility:
  deprecatedAliasesKeepFor: "2 major versions"
  resolveOrder: [newToken, variant, alias, fallbackDefault]
  note: "在 ColorKey.from / ColorTable.resolveRawSource 查表前加一次别名归一化即可，无需改动现有解析语义"
  lintRules:
    - 悬空引用检测（token.path 必须存在）
    - 循环引用检测
    - 类型检测（$type: color，值必须 #RRGGBBAA）
    - 明暗配对完整性（pair 指向的 id 必须存在）
    - 对比度检测（content on surface ≥ meta.contrast.minimum）
    - 废弃字段告警（命中 mappings 中任一 legacy 名时提示迁移）

stats:
  colorKeyEnums: 52
  schemaFields: 41
  builtinPositionLabels: 18
  developUnionFields: 72
  mappedLegacyFields: 91
  extensionCompatFields: 19
  newComponentTokens: 26
  variantRules: 12
  note: "mappedLegacyFields 覆盖 develop 全部 72 字段，另含 19 个社区/PDF 扩展字段作为兼容项"
