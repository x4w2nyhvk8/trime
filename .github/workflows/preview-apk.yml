name: Preview APK

on:
  push:
    branches:
      - preview/key-text-fit

concurrency:
  group: preview-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android NDK
        run: sdkmanager --install "cmake;3.31.6"

      - name: Calculate JNI cache hash
        id: cache-hash
        run: ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-debug-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Build debug Trime
        run: make debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: trime-preview-arm64
          path: app/build/outputs/apk/debug/*arm64-v8a-*.apk
          retention-days: 7
